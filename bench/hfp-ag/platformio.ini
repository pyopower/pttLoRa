; BANCO: la placa como PASARELA de manos libres (HFP-AG) para un micro-altavoz
; Bluetooth (JBL de prueba, despues el Abbree). Arduino como componente de
; ESP-IDF, porque el core precompilado trae el Bluetooth en papel de auricular
; y SIN canal de audio SCO (CONFIG_BTDM_CTRL_BR_EDR_MAX_SYNC_CONN=0).
;
; ⚠️ Si cambias sdkconfig.defaults, BORRA sdkconfig.hfpag: si no, se sigue
; usando el generado la primera vez y el cambio no entra.
;
; Trampa del 15-sep-2026: el entorno Python de ESP-IDF 4.4.7 que monta
; PlatformIO trae `schema` 0.7.8 y el gestor de componentes revienta
; ("expected string or bytes-like object, got 're.Pattern'"). Arreglo:
;   ~/.platformio/penv/.espidf-4.4.7/bin/pip install 'schema==0.7.5'
[env:hfpag]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino, espidf
board_build.partitions = particiones.csv
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../../firmware/lib-audio
; La OLED de la placa: en el transceptor es el unico instrumento que hay.
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
build_flags =
    -D__EMBEDDED__
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_1200_EN=1

; EL TRANSCEPTOR v0: lo mismo pero la voz va por LoRa (SX1278), sin WiFi.
[env:transceptor]
extends = env:hfpag
lib_deps =
    ${env:hfpag.lib_deps}
    jgromes/RadioLib @ ^7.1.0
build_flags =
    ${env:hfpag.build_flags}
    -DTRANSPORTE_LORA
