; BANCO: ¿cuánto se come Codec2 dentro del ESP32?
;
; La pregunta de la que depende todo lo demás (12-sep-2026): si el nodo llevara
; un micrófono propio —por Bluetooth o por I2S— el códec tendría que correr
; AQUÍ, y hoy vive en los extremos a propósito. Esto no lo decide una opinión,
; lo decide un número: cuántos microsegundos cuesta una trama y cuánta RAM se
; queda el codificador.
;
; Misma placa y mismos ajustes que el firmware de verdad, que si no la medida no
; vale para nada: ttgo-lora32-v21, 240 MHz, -Os.
[env:banco]
build_src_filter = +<main.cpp>
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Os
    ; ⚠️ LA LLAVE DE TODO ESTO. Sin `__EMBEDDED__`, los libros de códigos de
    ; Codec2 se declaran `static float` y aterrizan en DRAM: el enlazador se
    ; queja de 25 KB de más y no cabe ni el banco vacío. Con él son
    ; `static const float` y viven en flash, que es donde tienen que estar.
    -D__EMBEDDED__
    ; Sólo los modos que usa la app (ver Codec2.NOMBRES). Los demás se quedan
    ; fuera del binario: cada uno arrastra su libro de códigos.
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_3200_EN=1
    -DCODEC2_MODE_2400_EN=1
    -DCODEC2_MODE_1600_EN=1
    -DCODEC2_MODE_1300_EN=1
    -DCODEC2_MODE_1200_EN=1
    -DCODEC2_MODE_700C_EN=1

; El mismo entorno pero con un sketch vacío: sirve para restar y saber lo que
; cuesta Codec2 DE VERDAD, sin el suelo de Arduino.
[env:vacio]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
build_src_filter = +<vacio.cpp>
build_flags = -Os

; Y con UN SOLO modo, que es lo que llevaría un nodo autónomo de verdad: cada
; modo arrastra su libro de códigos, y en la ranura de OTA eso se nota.
[env:banco-1200]
build_src_filter = +<main.cpp>
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
build_flags =
    -Os
    -D__EMBEDDED__
    -DCODEC2_MODE_EN_DEFAULT=0
    -DCODEC2_MODE_1200_EN=1
    -DSOLO_1200

; Lo que pesa Bluetooth Classic con HFP, para saber si un firmware DEDICADO al
; micrófono Bluetooth cabe en la ranura de OTA.
[env:hfp]
build_src_filter = +<hfp.cpp>
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
build_flags = -Os

; Lo que pesa NimBLE, que es lo que se recuperaría si el firmware dedicado
; renuncia al enlace con el móvil.
[env:nimble]
build_src_filter = +<nimble.cpp>
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
build_flags = -Os
lib_deps = h2zero/NimBLE-Arduino @ ^1.4.1
