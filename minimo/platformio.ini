; Sketch minimo: solo RadioLib, sin nada de nuestro firmware alrededor.
; Sirve para separar si el fallo de recepcion es nuestro o de RadioLib/la placa.
[comun]
build_flags = -DFRQ=434.4 -DBWD=250.0 -DSFC=7 -DCRC4=5 -DSYW=0x3B -DPWR=2
lib_deps = jgromes/RadioLib @ ^7.1.0

[env:lora32]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps = ${comun.lib_deps}
build_flags = ${comun.build_flags}

[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
    ${comun.lib_deps}
    lewisxhe/XPowersLib @ ^0.2.7
build_flags = ${comun.build_flags} -DPLACA_TBEAM
