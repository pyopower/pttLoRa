; PTT LoRa — firmware del nodo.
;
; Placa: LilyGO LoRa32 v2.1 (T3 v1.6.1), ESP32 + SX1278, 420-520 MHz, 17 dBm.
; Es la que era el iGate de LoRa APRS; su firmware original esta guardado en
; ../backup/ y se puede restaurar con esptool.

[comun]
; El canal es lo unico que tienen que compartir dos nodos para oirse.
build_flags =
    ; Explicito aunque el framework ya lo pone por defecto (medido: ponerlo no
    ; cambia el tamaño ni un byte). Se deja para que un cambio futuro del
    ; framework no nos meta -O2 sin que nos enteremos: a este firmware le sobra
    ; CPU y lo que escasea es la ranura de OTA.
    -Os
    -DCANAL_MHZ=434.4
    -DCANAL_BW_KHZ=250.0
    -DCANAL_SF=7
    -DCANAL_CR=5
    -DCANAL_POTENCIA=17
    ; Limites del hardware. El SX1278 de estas placas cubre 420-520 MHz y su
    ; PA_BOOST va de 2 a 17 dBm. El nodo los publica y la app se ciñe a ellos.
    -DFREQ_MIN=420.0
    -DFREQ_MAX=520.0
    -DPOT_MIN=2
    -DPOT_MAX=17
    ; Banda permitida. Esto NO es un limite del hardware, es una decision del
    ; proyecto: PTT LoRa es para el servicio de aficionados, y 430-440 MHz es lo
    ; que esta atribuido a ese servicio en las tres regiones de la UIT. El chip
    ; llega a 520 y el firmware se niega igualmente: un despiste con el teclado
    ; no debe poder sacar a nadie de su banda.
    ; Quien tenga otra atribucion —otro servicio, otra licencia, otro pais—
    ; cambia estas dos lineas y recompila, y con ello asume lo que emite. No hay
    ; forma de hacerlo desde la app, y es a proposito.
    -DBANDA_MIN=430.0
    -DBANDA_MAX=440.0
    ; BLE, NO Bluetooth Classic (v1.26). Lo que echa a Bluedroid del binario es
    ; sencillamente NO INCLUIR <BluetoothSerial.h>: el core de Arduino trae la
    ; pila precompilada y el enlazador solo se lleva lo que se usa. Y la RAM del
    ; controlador Classic la suelta NimBLE-Arduino en su init, con
    ; `esp_bt_controller_mem_release(ESP_BT_MODE_CLASSIC_BT)`; no hay que hacer
    ; nada. Lo de abajo son ajustes de NimBLE, no de eso.
    ; ⛔ NO PONER AQUI -DCONFIG_BT_NIMBLE_EXT_ADV=0. Parece lo correcto para
    ; apagar el anuncio extendido de BLE 5 y hace justo lo contrario: NimBLE lo
    ; comprueba con `#ifdef`, no con el valor, asi que definirlo —aunque sea a
    ; cero— ENCIENDE esa rama y la compilacion muere en `ble_gap.c` con
    ; `CONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES undeclared`. Sin la linea ya
    ; viene apagado, que es lo que queremos.
    ; Se admite UN cliente a la vez (ver CbServidorBLE), pero se reservan DOS
    ; ranuras a proposito: si un movil se va sin despedirse, su conexion sigue
    ; ocupando sitio hasta que vence la supervision (4 s), y con una sola
    ; ranura ese hueco impediria reconectar. La segunda cuesta ~1 kB y es
    ; ademas el camino para el multiusuario, que es el siguiente paso.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; Buffers de salida. Con el de fabrica (12) la propia libreria avisa en su
    ; nimconfig.h de que "512 bytes con MTU 23 fallara" — y eso es exactamente
    ; nuestra linea de estado antes de que el movil negocie el MTU. Con 24 el
    ; reintento de `ble_escribe` casi nunca tiene que entrar.
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    ; VERSION CLAVADA A LA SERIE 1.4. NimBLE 2.x cambio la firma de los
    ; callbacks (`onConnect(NimBLEServer*, NimBLEConnInfo&)` en vez de
    ; `ble_gap_conn_desc*`) y el codigo de aqui NO compila con ella. Si algun
    ; dia se sube, hay que tocar CbServidorBLE y CbRxBLE a la vez.
    h2zero/NimBLE-Arduino @ ^1.4.2

; NOTA HISTORICA: esto llego a necesitar `huge_app` porque Bluetooth Classic se
; comia 828 KB el solo y el esquema por defecto quedaba al 89%. Desde la v1.26
; (BLE con NimBLE) sobra sitio de largo y hay tabla propia con DOS ranuras de
; aplicacion, que es lo que exige la actualizacion por el aire.
; UN SOLO FIRMWARE por placa. El papel del nodo (puente, repetidor, ambos) es un
; ajuste que se cambia desde la app y se guarda en el propio nodo: obligar a
; elegir binario seria pedirle al usuario un conocimiento que no tiene por que
; tener.
[env:lora32]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
; Tabla propia: dos ranuras de aplicacion (la OTA las exige) lo mas grandes
; posible, sin el SPIFFS que no usamos. Ver particiones.csv.
board_build.partitions = particiones.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${comun.lib_deps}
build_flags = ${comun.build_flags}

; T-Beam v1.2: mismo patillaje de radio, pero la alimentacion del SX1278 y del
; GPS cuelga del AXP2101. Sin encender esos raíles la radio simplemente no
; existe, que es la trampa clasica de esta placa.
[env:tbeam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
; Tabla propia: dos ranuras de aplicacion (la OTA las exige) lo mas grandes
; posible, sin el SPIFFS que no usamos. Ver particiones.csv.
board_build.partitions = particiones.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ${comun.lib_deps}
    lewisxhe/XPowersLib @ ^0.2.7
build_flags =
    ${comun.build_flags}
    -DPLACA_TBEAM

